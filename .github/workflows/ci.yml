name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .env depuis .env.example, avec un mot de passe admin de test généré (aucun secret réel)
        run: |
          pw="e2e-$(openssl rand -hex 12)"
          echo "::add-mask::$pw"
          echo "ADMIN_E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
          hash=$(docker run --rm caddy:2 caddy hash-password --plaintext "$pw")
          sed -e 's/^IP_HASH_SALT=.*/IP_HASH_SALT=ci-salt-0123456789abcdef/' -e '/^ADMIN_PASSWORD_HASH=/d' .env.example > .env
          echo "ADMIN_PASSWORD_HASH='$hash'" >> .env
      - run: docker compose up --build -d
      - name: Attendre le back et le SSR
        run: timeout 180 sh -c "until curl -fs localhost:4000/api/fr/home >/dev/null && curl -fs localhost:4000/fr/ >/dev/null; do sleep 3; done"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        run: docker compose logs --tail 100
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
      - if: always()
        run: docker compose down

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .env depuis .env.example
        run: sed 's/^IP_HASH_SALT=.*/IP_HASH_SALT=ci-salt-0123456789abcdef/' .env.example > .env
      - run: docker compose up --build -d
      - name: Attendre le back et le SSR
        run: timeout 180 sh -c "until curl -fs localhost:4000/api/fr/home >/dev/null && curl -fs localhost:4000/fr/ >/dev/null; do sleep 3; done"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx lhci autorun --config=lighthouserc.json
        working-directory: frontend
      - if: always()
        run: docker compose down
