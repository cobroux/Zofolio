services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    # pas d'env_file : le SSR n'a besoin d'aucun secret
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4000:4000"

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
