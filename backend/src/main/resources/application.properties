spring.application.name=zofolio
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zofolio}
spring.datasource.username=${DB_USER:zofolio}
spring.datasource.password=${DB_PASSWORD:zofolio}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.mvc.problemdetails.enabled=true
server.forward-headers-strategy=native
# XFF accepté seulement d'un proxy du réseau Docker (172.16/12) ; loopback et clients directs exclus
server.tomcat.remoteip.internal-proxies=172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}
server.error.include-stacktrace=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# github-sync (D17-D19) : token jamais journalisé ; vide = aucun appel
zofolio.github.login=cobroux
zofolio.github.token=${GITHUB_TOKEN:}
zofolio.github.sync.enabled=true
# admin (D35-D38) : hash bcrypt (coût >= 12) en variable d'environnement, vide = connexion refusée
zofolio.admin.password-hash=${ADMIN_PASSWORD_HASH:}
# session unique en mémoire, cookie __Host- (D37)
server.servlet.session.cookie.name=__Host-zadmin
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/
server.servlet.session.timeout=2h
# médias téléversés (D43) : 5 Mo max ; Caddy borne le corps à 6 Mo sur /api/admin/media
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
