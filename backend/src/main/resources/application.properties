spring.application.name=zofolio
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zofolio}
spring.datasource.username=${DB_USER:zofolio}
spring.datasource.password=${DB_PASSWORD:zofolio}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.mvc.problemdetails.enabled=true
server.forward-headers-strategy=native
# XFF accepté seulement d'un proxy du réseau Docker (172.16/12) ; loopback et clients directs exclus
server.tomcat.remoteip.internal-proxies=172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}
server.error.include-stacktrace=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
